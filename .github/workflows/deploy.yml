# ============================================================
# WORKFLOW: Despliegue Automático a GitHub Pages 
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 1. CREAR CARPETA DE SALIDA
      # ============================================================
      - name: Create output directory
        run: mkdir -p docs

      # ============================================================
      # 2. COPIAR EL index.html PERSONALIZADO (DESDE LA RAÍZ)
      # ============================================================
      - name: Copy custom index.html
        run: cp index.html docs/

      # ============================================================
      # 3. GENERAR REPORTES HTML (ydata-profiling)
      # ============================================================
      - name: Generate HTML reports
        run: |
          python src/generate_reports.py

      # ============================================================
      # 4. COPIAR REPORTES A docs/
      # ============================================================
      - name: Copy reports to docs
        run: |
          cp reports/report_raw.html docs/ 2>/dev/null || true
          cp reports/report_processed.html docs/ 2>/dev/null || true

      # ============================================================
      # 5. CONVERTIR NOTEBOOKS A HTML
      # ============================================================
      - name: Convert notebooks to HTML
        run: |
          jupyter nbconvert --to html notebooks/*.ipynb --output-dir=docs/

      # ============================================================
      # 6. COPIAR FIGURAS Y ASSETS
      # ============================================================
      - name: Copy assets
        run: |
          cp -r reports/figures docs/ 2>/dev/null || true

      # ============================================================
      # 7. DESPLEGAR A GITHUB PAGES
      # ============================================================
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true